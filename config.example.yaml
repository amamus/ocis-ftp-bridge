server:
  listen: ":21"
  passive:
    min_port: 30000
    max_port: 30020
    public_ip: ""
  tls:
    enabled: true  # TLS is enabled by default for security
    cert: /etc/ocis-ftp/tls.crt  # Path to TLS certificate
    key: /etc/ocis-ftp/tls.key   # Path to TLS private key
  # Rate limiting configuration
  rate_limiting:
    max_connections_per_ip: 10    # Maximum connections per IP address
    max_global_connections: 100   # Maximum total connections to the server
    max_auth_attempts_per_ip: 5   # Maximum authentication attempts per IP
    auth_attempt_window: 1m       # Time window for auth attempt tracking
    auth_lockout_duration: 5m    # Duration to lock out IP after max failed attempts
    track_failed_attempts: true  # Enable tracking of failed auth attempts for rate limiting

ocis:
  url: https://cloud.example.com

spool:
  directory: /var/lib/ocis-ftp/spool
  max_total_size: 2GiB

# HTTP server for health checks and metrics
http:
  address: ":9090"  # HTTP server address for health/ready endpoints
  auth:
    enabled: true  # Authentication enabled by default for security
    method: basic  # Authentication method: basic, bearer, or none
    username: admin  # HTTP basic auth username
    # password: ""  # Password will be auto-generated if not specified
    # For production, set a strong password or use bearer token

accounts:
  - username: reception
    # Example-only syntactically valid Argon2id PHC value. Generate your own hash.
    password_hash: "$argon2id$v=19$m=65536,t=3,p=1$MDEyMzQ1Njc4OWFiY2RlZg$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    ocis:
      username: scanner-service
      app_token_env: OCIS_FTP_RECEPTION_TOKEN
    target:
      drive_id: ""
      drive: "Incoming Scans"
      root: "/Reception"
    upload:
      collision_policy: rename
      max_size: 250MiB
