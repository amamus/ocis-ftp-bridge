ocis:
  url: https://cloud.example.com

spool:
  directory: /var/lib/ocis-ftp/spool
  max_total_size: 2GiB

# HTTP server for health checks and metrics
http:
  address: ":9200"  # HTTP server address for health/ready endpoints (must match container port)
  auth:
    enabled: true  # Authentication enabled by default for security
    method: basic  # Authentication method: basic, bearer, or none
    username: admin  # HTTP basic auth username
    # password: ""  # Password will be auto-generated if not specified
    # For production, set a strong password or use bearer token

accounts:
  - username: reception
    # Password hash (Argon2id PHC format).
    # NEVER use plaintext passwords. Generate hashes using:
    #   htpasswd -B -C 12 -i -d password | tr -d '\n'
    # Or: go run cmd/hash-password/main.go
    # Replace this with your own generated hash!
    password_hash: "$argon2id$v=19$m=65536,t=3,p=1$gK3n5v9Bw5Fh8Lm2NqPj7H$CWQ2EeT5RfYhNjDfGvXpBnMqLkJhGfDs"
    ocis:
      username: scanner-service
      # oCIS App Token - use environment variable for security
      # Set the environment variable before starting the service:
      #   export OCIS_FTP_RECEPTION_TOKEN="your-app-token-here"
      app_token_env: OCIS_FTP_RECEPTION_TOKEN
    target:
      drive_id: ""
      drive: "Incoming Scans"
      root: "/Reception"
    upload:
      collision_policy: rename
      max_size: 250MiB
