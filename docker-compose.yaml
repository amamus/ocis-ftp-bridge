# ocis-ftp-bridge Docker Compose Example
#
# This example demonstrates how to deploy the ocis-ftp-bridge alongside oCIS
# for printer/scanner FTP ingestion.
#
# Usage:
#   docker-compose -f docker-compose.yaml up -d
#
# Note: This example uses placeholder values. Replace with your actual
# oCIS configuration and credentials.

version: '3.8'

services:
  # =========================================================================
  # ocis-ftp-bridge Service
  # =========================================================================
  ocis-ftp-bridge:
    image: ghcr.io/amamus/ocis-ftp-bridge:latest
    # Build locally instead of pulling from registry:
    # build: .
    # image: ocis-ftp-bridge:local
    container_name: ocis-ftp-bridge
    restart: unless-stopped
    
    # Run as non-root user for security
    user: "1000:1000"
    
    # Environment variables
    environment:
      - TZ=UTC
    
    # Ports
    ports:
      # FTP control port
      - "2121:2121/tcp"
      # FTP passive port range
      - "40000-50000:40000-50000/tcp"
      # HTTP operations/health port
      - "9200:9200/tcp"
    
    # Volumes
    volumes:
      # Configuration file
      - ./config:/app/config:ro
      # Spool directory for temporary uploads
      - ./spool:/app/spool
      # Logs directory
      - ./logs:/app/logs
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    
    # Network configuration
    networks:
      - ocis-network
    
    # Dependencies
    depends_on:
      ocis:
        condition: service_healthy

  # =========================================================================
  # oCIS Service (Example - adjust to your oCIS deployment)
  # =========================================================================
  ocis:
    image: owncloud/ocis:latest
    container_name: ocis
    restart: unless-stopped
    
    # Environment variables for oCIS configuration
    environment:
      - OCIS_URL=https://ocis.example.com
      - OCIS_INSECURE=false
      - PROXY_HTTP_ADDR=0.0.0.0:9200
      - STORAGE_USERS_PROVISIONING_API_ADDR=0.0.0.0:9140
      - IDP_ISS=https://ocis.example.com
      # oCIS requires additional configuration - see oCIS documentation
    
    ports:
      # oCIS HTTP port
      - "9200:9200/tcp"
      # oCIS WebDAV port
      - "9155:9155/tcp"
      # oCIS Graph API port
      - "9240:9240/tcp"
    
    volumes:
      # oCIS data volumes
      - ocis-data:/var/lib/ocis
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    networks:
      - ocis-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

# ===========================================================================
# Networks
# ===========================================================================
networks:
  ocis-network:
    driver: bridge

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  ocis-data: