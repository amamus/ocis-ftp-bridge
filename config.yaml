server:
  listen: ":21"
  passive:
    min_port: 30000
    max_port: 30020
    public_ip: ""

  tls:
    enabled: false
    cert: /etc/ocis-ftp/tls.crt
    key: /etc/ocis-ftp/tls.key

ozis:
  url: https://cloud.example.com

spool:
  directory: /var/lib/ocis-ftp/spool
  max_total_size: 2GiB

accounts:
  - username: reception
    password_hash: "$argon2id$v=19$m=65536,t=3,p=1$6L3n2b9z5qY6b8f7cK9h2$8a8c6b4e3c1d9f3a2b1f1e4d5e6f7d8c9"
    ocis:
      username: scanner-service
      app_token_env: OCIS_FTP_RECEPTION_TOKEN
    target:
      drive_id: ""
      drive: "Incoming Scans"
      root: "/Reception"
    upload:
      collision_policy: rename
      max_size: 250MiB
