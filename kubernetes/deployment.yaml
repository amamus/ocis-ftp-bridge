# ocis-ftp-bridge Kubernetes Deployment
#
# This example demonstrates how to deploy the ocis-ftp-bridge in Kubernetes
# for printer/scanner FTP ingestion into oCIS.
#
# Usage:
#   kubectl apply -f kubernetes/
#
# Prerequisites:
#   The example enables explicit FTPS (AUTH TLS). Create the TLS Secret
#   before applying:
#     kubectl create namespace ocis-ftp-bridge
#     kubectl create secret tls ocis-ftp-bridge-tls \
#       --cert=ftp.crt --key=ftp.key -n ocis-ftp-bridge
#
# Note: This example uses placeholder values. Replace with your actual
# configuration and adjust resource requirements as needed.

apiVersion: v1
kind: Namespace
metadata:
  name: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge
    component: ftp-bridge

---
# Service Account with minimal permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocis-ftp-bridge
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge

---
# ConfigMap for configuration (minimal example - use Secrets for sensitive data)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocis-ftp-bridge-config
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge

data:
  config.yaml: |
    server:
      listen: ":2121"
      # Connection and rate limits are enforced per bridge instance: with
      # N replicas the effective limit is N times the configured value
      # (see docs/adr/0001-multi-replica-scaling.md).
      max_connections: 100
      passive:
        min_port: 40000
        max_port: 50000
        # public_ip: "10.0.0.100"  # Set to the external IP if behind NAT
      # Explicit FTPS (AUTH TLS). The certificate and key come from the
      # ocis-ftp-bridge-tls Secret (see the volumes section below).
      tls:
        enabled: true
        cert: "/etc/ssl/ftp-bridge/tls.crt"
        key: "/etc/ssl/ftp-bridge/tls.key"

    http:
      address: ":9090"
      # Bridge-level auth is disabled: kubelet httpGet probes cannot send
      # credentials, and this Service is ClusterIP (cluster-internal only).
      # Restrict access with a NetworkPolicy; front /metrics with an
      # authenticating ingress if it must leave the cluster.
      auth:
        enabled: false
    
    ocis:
      url: "https://ocis.ocis.svc.cluster.local:9200"
      graph_url: "https://ocis.ocis.svc.cluster.local:9200/api/libregraph"
      webdav_url: "https://ocis.ocis.svc.cluster.local:9200/webdav"
    
    spool:
      directory: "/var/spool/ocis-ftp-bridge"
      max_total_size: 10GiB
    
    observability:
      debug: false
    
    # Account configurations would go here
    # accounts:
    #   - username: "printer1"
    #     password_hash: "$argon2id$v=19$m=65536,t=3,p=4$..."
    #     ocis:
    #       username: "service-account"
    #       app_token_env: "OCIS_APP_TOKEN"
    #     target:
    #       drive: "Printer Uploads"
    #       root: "/uploads"
    #     upload:
    #       collision_policy: "rename"
    #       max_size: 100MiB

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocis-ftp-bridge
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge
    component: ftp-bridge

spec:
  # Replica count is managed by the HPA below (min 1, max 3). Multi-replica
  # is safe: the spool is a per-replica emptyDir and FTP sessions are pinned
  # to a pod by the Services' sessionAffinity: ClientIP
  # (docs/adr/0001-multi-replica-scaling.md, issue #71).
  replicas: 1

  selector:
    matchLabels:
      app: ocis-ftp-bridge
      component: ftp-bridge

  template:
    metadata:
      labels:
        app: ocis-ftp-bridge
        component: ftp-bridge
        version: "1.0.0"
      # This is a plain kubectl manifest (no Helm template syntax). After
      # changing the ConfigMap, roll the pods manually:
      #   kubectl rollout restart deployment/ocis-ftp-bridge -n ocis-ftp-bridge

    spec:
      # Run as non-root for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        
      serviceAccountName: ocis-ftp-bridge
      
      containers:
      - name: ocis-ftp-bridge
        image: ghcr.io/amamus/ocis-ftp-bridge:latest
        imagePullPolicy: IfNotPresent
        
        # Ports
        ports:
        - name: ftp
          containerPort: 2121
          protocol: TCP
        - name: passive-min
          containerPort: 40000
          protocol: TCP
        - name: passive-max
          containerPort: 50000
          protocol: TCP
        - name: http
          containerPort: 9090
          protocol: TCP
        
        # Resource requests and limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        
        # Liveness and readiness probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Security context for the container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        
        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tls-certs
          mountPath: /etc/ssl/ftp-bridge
          readOnly: true
        - name: spool
          mountPath: /var/spool/ocis-ftp-bridge
        - name: tmp
          mountPath: /tmp
        
        # Environment variables
        env:
        - name: TZ
          value: UTC
        - name: CONFIG_FILE
          value: /app/config/config.yaml
        
        # Command and arguments
        command: ["/app/bin/ocis-ftp-bridge"]
        args: ["-config", "/app/config/config.yaml"]
      
      # Volumes
      volumes:
      - name: config
        configMap:
          name: ocis-ftp-bridge-config
      # TLS certificate for explicit FTPS; create before applying (see the
      # header of this file).
      - name: tls-certs
        secret:
          secretName: ocis-ftp-bridge-tls
      # The spool is a per-replica emptyDir: uploads are pushed to oCIS
      # within the FTP session, so the spool never needs sharing between
      # replicas. The in-bridge spool monitor enforces max_total_size per
      # instance. Trade-off: a pod crash loses that pod's in-flight
      # uploads; FTP has no resume, so the printer simply retries.
      - name: spool
        emptyDir: {}
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi

---
# Service for FTP access
apiVersion: v1
kind: Service
metadata:
  name: ocis-ftp-bridge-ftp
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge
    component: ftp-bridge

spec:
  type: LoadBalancer
  # FTP sessions are long-lived and cannot be rebalanced; pin each client
  # to one pod so control and data connections stay together (issue #71).
  sessionAffinity: ClientIP
  selector:
    app: ocis-ftp-bridge
    component: ftp-bridge
  
  ports:
  - name: ftp
    port: 2121
    targetPort: 2121
    protocol: TCP

---
# Service for HTTP operations (health, metrics)
apiVersion: v1
kind: Service
metadata:
  name: ocis-ftp-bridge-http
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge
    component: ftp-bridge

spec:
  type: ClusterIP
  selector:
    app: ocis-ftp-bridge
    component: ftp-bridge
  
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP

---
# Service for passive FTP port range (if using NodePort or LoadBalancer)
# Note: FTP passive mode requires special handling in Kubernetes.
# This is an example configuration that may need adjustment based on your environment.
apiVersion: v1
kind: Service
metadata:
  name: ocis-ftp-bridge-passive
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge
    component: ftp-bridge

spec:
  type: LoadBalancer
  # Pin passive data connections the same way as the control connection:
  # ClientIP affinity hashes the same client IP to the same pod on both
  # Services (issue #71).
  sessionAffinity: ClientIP
  selector:
    app: ocis-ftp-bridge
    component: ftp-bridge
  
  ports:
  - name: passive-40000
    port: 40000
    targetPort: 40000
    protocol: TCP
  - name: passive-40001
    port: 40001
    targetPort: 40001
    protocol: TCP
  # Note: Kubernetes doesn't support port ranges in Services.
  # For full passive port range support, consider using a NodePort service
  # with a custom external load balancer or FTP-aware ingress controller.

---
# Horizontal Pod Autoscaler (optional)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ocis-ftp-bridge-hpa
  namespace: ocis-ftp-bridge
  labels:
    app: ocis-ftp-bridge

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ocis-ftp-bridge
  
  minReplicas: 1
  # Multi-replica is safe: the spool is a per-replica emptyDir and FTP
  # sessions are pinned by sessionAffinity: ClientIP. Rate limits and
  # connection limits are per-instance, so the effective limit scales with
  # the replica count (docs/adr/0001-multi-replica-scaling.md, issue #71).
  maxReplicas: 3
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80